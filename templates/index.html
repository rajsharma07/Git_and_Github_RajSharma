<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daymark | Welcome</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .welcome-card {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="welcome-card">

            <h1>Welcome to Daymark</h1>

            <p>
                Stay organized, manage your tasks,
                and keep the important things moving.
            </p>

            <a href="/todo" class="button">
                Go to To-Do List
            </a>

        </div>

    </div>

</body>
</html>
